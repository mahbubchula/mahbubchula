<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="150" viewBox="0 0 1200 150" role="img" aria-labelledby="title desc">
  <title id="title">Research impact at a glance</title>
  <desc id="desc">190,910 road crashes analysed (South Australia, 2012–2024); 16 journal venues (peer-reviewed publications); 4 articles accepted (forthcoming publications); 31 manuscripts reviewed (for 21 journals); 20+ researchers mentored (B&#x27;Deshi Research Lab); 100K+ YouTube views (open research education)</desc>
