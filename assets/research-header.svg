<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" role="img" aria-labelledby="title description">
  <title id="title">Mahbub Hassan</title>
  <desc id="description">Transportation engineering researcher working on safer, smarter and more sustainable mobility.</desc>
  <defs>
