<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="90" viewBox="0 0 1200 90" role="img" aria-labelledby="title desc">
  <title id="title">Thanks for visiting</title>
  <desc id="desc">Animated road with vehicles travelling across, closing the profile.</desc>
  <defs>
    <linearGradient id="fade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#D6F5F1" stop-opacity="0"/>
      <stop offset="0.15" stop-color="#D6F5F1" stop-opacity="0.10"/>
      <stop offset="0.85" stop-color="#D6F5F1" stop-opacity="0.10"/>
      <stop offset="1" stop-color="#D6F5F1" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <rect x="0" y="34" width="1200" height="34" fill="url(#fade)"/>
  <path d="M60 51H1140" stroke="#F3C969" stroke-opacity="0.7" stroke-width="2" stroke-dasharray="14 14">
    <animate attributeName="stroke-dashoffset" from="0" to="-56" dur="1.4s" repeatCount="indefinite"/>
  </path>
  <g>
    <rect x="-14" y="38" width="28" height="10" rx="4" fill="#54D2D8"/>
    <animateMotion path="M-40 0H1240" dur="8s" repeatCount="indefinite"/>
  </g>
  <g>
    <rect x="-14" y="55" width="28" height="10" rx="4" fill="#F3C969"/>
    <animateMotion path="M1240 0H-40" dur="10s" repeatCount="indefinite"/>
  </g>
  <text x="600" y="22" text-anchor="middle" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13" font-weight="700" letter-spacing="3" fill="#93B4BA">SAFER ROADS · SMARTER MOBILITY · OPEN SCIENCE</text>
</svg>
